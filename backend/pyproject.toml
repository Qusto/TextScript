[tool.poetry]
name = "textscript-backend"
version = "0.1.0"
description = "FastAPI backend for TextScript article generation with SSE streaming"
authors = ["TextScript Team"]
# AICODE-NOTE: package-mode false - we're not creating a distributable package
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
# AICODE-NOTE: FastAPI for async SSE streaming API
fastapi = "^0.100.0"
# AICODE-NOTE: uvicorn for ASGI server with long-running connections
uvicorn = {extras = ["standard"], version = "^0.23.0"}
# AICODE-NOTE: Loguru for structured logging with colors
loguru = "^0.7.0"
# AICODE-NOTE: Pydantic for request/response validation
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
# AICODE-NOTE: T086 - SQLAlchemy for database ORM (style profiles storage)
sqlalchemy = "^2.0.0"
# AICODE-NOTE: Dependencies for ugly_script.py from /src/
openai = "^1.0"
requests = "^2.31"
beautifulsoup4 = "^4.12"
lxml = "^5.3"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
# AICODE-NOTE: pytest-asyncio for async test support
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"
# AICODE-NOTE: httpx for testing SSE endpoints (newer version for Python 3.14 compatibility)
httpx = "^0.27.0"
# AICODE-NOTE: ruff for fast linting
ruff = "^0.0.286"
mypy = "^1.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# AICODE-NOTE: asyncio mode auto for seamless async test execution
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
